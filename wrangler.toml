name = "scaramouche-film-website"
main = "src/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Nur diese Pfade laufen zuerst durch den Worker – alles andere kommt
# unverändert aus dem Asset-Storage.
run_worker_first = ["/api/*", "/admin", "/admin/*", "/gaestebuch", "/gaestebuch/*", "/blog/*"]

# Kommentar-Datenbank. database_id wird von "wrangler d1 create" ausgegeben.
[[d1_databases]]
binding = "DB"
database_name = "heart-and-soul-kommentare"
database_id = "HIER_DIE_ID_AUS_WRANGLER_D1_CREATE_EINSETZEN"

# Moderation (Llama Guard 3 + Spam-Check)
[ai]
binding = "AI"

[vars]
# Öffentlicher Turnstile-Key, darf im HTML stehen.
TURNSTILE_SITEKEY = ""

# Geheim, per "wrangler secret put" setzen, NICHT hier eintragen:
#   TURNSTILE_SECRET  – Turnstile Secret Key
#   ADMIN_KEY         – Passwort für /admin
#   IP_SALT           – beliebige Zufallszeichenkette (IPs werden nur gehasht gespeichert)
#   NOTIFY_WEBHOOK    – optional: Discord/Slack-Webhook für Beiträge in der Prüfung
